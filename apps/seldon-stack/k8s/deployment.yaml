apiVersion: apps/v1
kind: Deployment
metadata:
  name: seldon-stack
  namespace: seldon
  labels: { app: seldon-stack }
spec:
  replicas: 1
  selector:
    matchLabels: { app: seldon-stack }
  template:
    metadata:
      labels: { app: seldon-stack }
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: seldon-stack
          image: ghcr.io/gorlitzer-labs/seldon-stack:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 250m, memory: 512Mi }
