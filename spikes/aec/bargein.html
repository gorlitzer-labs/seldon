<!doctype html>
<meta charset="utf-8">
<title>Aria barge-in spike</title>
<link rel="icon" href="data:,">
<style>
  body{font:14px ui-monospace,Menlo,monospace;background:#0b0e13;color:#cfe3ff;padding:2rem;max-width:52rem;margin:auto}
  button{font:inherit;padding:.6rem 1.1rem;background:#1b2738;color:#cfe3ff;border:1px solid #2f4358;border-radius:6px;cursor:pointer}
  button:disabled{opacity:.4;cursor:default}
  #log{white-space:pre-wrap;margin-top:1rem;line-height:1.5}
  .warn{color:#ffcf70} .cue{color:#7ee787;font-size:1.15rem}
</style>
<h2>Aria &mdash; barge-in spike</h2>
<p class="warn">Speakers, not headphones. AGC is OFF this time, so all three phases share one mic gain.</p>
<p>Can the mic still hear <b>you</b> while Aria is talking? Speak normally when prompted &mdash;
count &ldquo;one two three four&rdquo; over and over at your usual volume.</p>
<button id="go">Run test (~21s)</button>
<div class="cue" id="cue"></div>
<div id="log"></div>
<script type="module">
import { log, connect, send, capture } from './capture.js';
const cue = (s) => document.getElementById('cue').textContent = s;

// AGC off is the point: it kept mic gain fixed so the phases are comparable.
const C = { echoCancellation: true, noiseSuppression: false, autoGainControl: false };

document.getElementById('go').onclick = async () => {
  const btn = document.getElementById('go');
  btn.disabled = true;
  document.getElementById('log').textContent = '';
  await connect();
  const ctx = new AudioContext();
  await ctx.resume();
  log(`AudioContext sampleRate = ${ctx.sampleRate} Hz\n`);

  log('1/3 speak normally, NO tone (baseline for your voice)');
  cue('SPEAK NOW - "one two three four", keep going');
  await capture(ctx, C, 'speech-only', 7);

  log('2/3 tone playing, stay SILENT (measures leftover echo)');
  cue('SILENCE - do not speak');
  await capture(ctx, C, 'tone-only', 7, true);

  log('3/3 tone playing AND you speaking (the real barge-in case)');
  cue('SPEAK OVER THE TONE - "one two three four"');
  await capture(ctx, C, 'speech-over-tone', 7, true);

  cue('');
  send({ phase: 'done' });
  log('\ndone - verdict is in the terminal.');
  btn.disabled = false;
};
</script>
