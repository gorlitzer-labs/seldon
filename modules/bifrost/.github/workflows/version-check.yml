name: Version Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'bifrost'
      - 'install.sh'

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version bump
        run: |
          # Get version from PR branch
          pr_version=$(grep -m1 '^BIFROST_VERSION=' bifrost | cut -d'"' -f2)

          # Get version from main
          main_version=$(git show origin/main:bifrost | grep -m1 '^BIFROST_VERSION=' | cut -d'"' -f2)

          echo "Main:   $main_version"
          echo "Branch: $pr_version"

          if [[ "$pr_version" == "$main_version" ]]; then
            echo ""
            echo "::error::Version not bumped. Update BIFROST_VERSION in the bifrost script before merging."
            echo ""
            echo "  Current: $main_version"
            echo "  Bump to: patch (x.x.+1), minor (x.+1.0), or major (+1.0.0)"
            exit 1
          fi

          # Validate semver bump direction (new must be higher)
          IFS='.' read -r cur_major cur_minor cur_patch <<< "$main_version"
          IFS='.' read -r new_major new_minor new_patch <<< "$pr_version"

          valid=false
          if [[ "$new_major" -gt "$cur_major" ]]; then
            valid=true
          elif [[ "$new_major" -eq "$cur_major" && "$new_minor" -gt "$cur_minor" ]]; then
            valid=true
          elif [[ "$new_major" -eq "$cur_major" && "$new_minor" -eq "$cur_minor" && "$new_patch" -gt "$cur_patch" ]]; then
            valid=true
          fi

          if [[ "$valid" != "true" ]]; then
            echo ""
            echo "::error::Version must increase. $pr_version is not higher than $main_version."
            exit 1
          fi

          echo ""
          echo "Version bump OK: $main_version → $pr_version"
