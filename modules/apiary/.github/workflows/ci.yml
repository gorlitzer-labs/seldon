name: CI

# Gate every PR and every push to main on typecheck + build + the full test
# suite. Publishing (publish.yml) is tag-triggered and runs the same checks
# before it publishes, but this catches regressions at PR time — before merge.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
