<!doctype html>
<meta charset="utf-8">
<title>Boomer</title>
<link rel="icon" href="data:,">
<style>
  :root{--bg:#080b10;--fg:#cfe3ff;--dim:#5d7893;--accent:#7ee787}
  *{box-sizing:border-box}
  body{font:15px/1.6 ui-monospace,Menlo,monospace;background:var(--bg);color:var(--fg);
       margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
  main{width:min(46rem,100%)}
  h1{font-size:1.1rem;letter-spacing:.35em;text-transform:uppercase;color:var(--dim);
     font-weight:400;margin:0 0 2rem}
  #avatar{display:none;width:100%;max-width:22rem;height:24rem;margin:0 auto .5rem;
          border-radius:14px;border:1px solid #141c26}
  /* the avatar replaces the orb only once WebGL has actually started */
  body[data-avatar=on] #avatar{display:block}
  body[data-avatar=on] #orb{display:none}
  #orb{width:96px;height:96px;border-radius:50%;margin:0 auto 1.5rem;
       background:radial-gradient(circle at 35% 30%,#2a4763,#0d1520 70%);
       box-shadow:0 0 0 1px #1d2c3d, 0 0 40px -8px #2a4763;transition:.35s}
  body[data-state=listening] #orb{box-shadow:0 0 0 1px #2f6b46,0 0 60px -6px #2f8f57}
  body[data-state=thinking]  #orb{box-shadow:0 0 0 1px #6b5a2f,0 0 60px -6px #b08b2a;
       animation:pulse 1.1s ease-in-out infinite}
  body[data-state=speaking]  #orb{box-shadow:0 0 0 1px #2f5a6b,0 0 70px -4px #3aa0c9;
       animation:pulse .7s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.06)}}
  #state{text-align:center;color:var(--dim);letter-spacing:.2em;text-transform:uppercase;
         font-size:.75rem;margin-bottom:2rem}
  .row{margin:.75rem 0;min-height:1.6em}
  .who{color:var(--dim);display:inline-block;width:4.5rem}
  #boomer{color:var(--accent)}
  #metrics,#hint{color:var(--dim);font-size:.78rem;margin-top:1.5rem}
  #voicepanel{margin-top:1.75rem;padding-top:1.25rem;border-top:1px solid #182230}
  #voicepanel h2{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;
                 color:var(--dim);font-weight:400;margin:0 0 .75rem}
  #roster{list-style:none;padding:0;margin:0 0 1rem}
  #roster li{display:flex;align-items:center;gap:.6rem;padding:.3rem 0}
  #roster .role{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;
                padding:.1rem .45rem;border-radius:3px;border:1px solid #2a3a4d;color:var(--dim)}
  #roster .role.owner{color:#ffcf70;border-color:#5a4a20}
  #roster .q{color:var(--dim);font-size:.72rem;margin-left:auto}
  #roster button{padding:.15rem .5rem;font-size:.72rem;margin:0}
  .enrol{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
  .enrol input[type=text]{font:inherit;padding:.45rem .6rem;background:#0d141d;
      color:var(--fg);border:1px solid #24384d;border-radius:6px;width:9rem}
  .enrol label{color:var(--dim);font-size:.78rem;display:flex;align-items:center;gap:.35rem}
  .note{opacity:.7}
  #phrases{color:var(--fg);font-size:.85rem;line-height:1.9;margin:1rem 0 0;padding-left:1.4rem}
  #phrases li.done{color:var(--dim);text-decoration:line-through}
  #phrases li.now{color:var(--accent)}
  #estatus{color:var(--dim);font-size:.78rem;margin-top:.75rem;min-height:1.2em}
  /* she started this one, not you */
  body[data-unprompted] #boomer{color:#ffcf70}
  body[data-unprompted] #orb{box-shadow:0 0 0 1px #6b5a2f,0 0 70px -4px #d9a13a}
  button{font:inherit;padding:.5rem 1rem;background:#131c27;color:var(--fg);
         border:1px solid #24384d;border-radius:6px;cursor:pointer;margin-right:.5rem}
  button:disabled{opacity:.35;cursor:default}
</style>
<main>
  <h1>Boomer</h1>
  <canvas id="avatar" width="360" height="460"></canvas>
  <div id="orb"></div>
  <div id="state">offline</div>
  <div class="row"><span class="who">you</span><span id="you"></span></div>
  <div class="row"><span class="who">boomer</span><span id="boomer"></span></div>
  <div id="hint">press start, allow the microphone, then just talk</div>
  <div id="metrics"></div>
  <p style="margin-top:1.5rem">
    <button id="go">start</button>
    <button id="stop">stop talking</button>
    <button id="reset">new conversation</button>
    <button id="voices">voices</button>
  </p>

  <section id="voicepanel" hidden>
    <h2>Voices she knows</h2>
    <ul id="roster"></ul>
    <div class="enrol">
      <input id="ename" type="text" placeholder="name" maxlength="40" autocomplete="off">
      <label><input id="eowner" type="checkbox"> owner
        <span class="note">can answer the factory and change her memory</span></label>
      <button id="enrol">enrol this voice</button>
      <button id="ecancel" hidden>cancel</button>
    </div>
    <ol id="phrases" hidden></ol>
    <div id="estatus"></div>
  </section>
</main>
<script type="module" src="./boomer.js"></script>
