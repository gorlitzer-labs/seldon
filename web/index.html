<!doctype html>
<meta charset="utf-8">
<title>Boomer</title>
<link rel="icon" href="data:,">
<style>
  /* Boomer is an instrument, not an app. The console vocabulary -- hairlines,
     calibration marks, a monospace face -- is earned here: it is a
     terminal-launched local tool, and the avatar already speaks in radial
     tick marks. What it must NOT look like is a settings form, which is what
     four equal rounded buttons in a row made it.

     --accent is rewritten from JS on every state change, so the chrome is
     wired to the instrument rather than sitting next to it. */
  :root{
    --ink:#05080b;
    --panel:#080c11;
    --line:#141d27;
    --line-lit:#22303f;
    --fg:#c9dcef;
    --dim:#54697f;
    --accent:#4a6377;          /* offline; JS drives this */
    --mine:#ff9e3d;
    --pad:clamp(1.25rem, 4vw, 2.5rem);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--ink);color:var(--fg);
    font:13px/1.6 ui-monospace,"SF Mono",Menlo,monospace;
    display:grid;place-items:center;padding:var(--pad);
    -webkit-font-smoothing:antialiased;
  }
  main{width:min(30rem,100%)}

  /* --- identity: small, not a hero. The avatar is the hero. --- */
  .id{display:flex;align-items:baseline;gap:.6rem;margin-bottom:1rem}
  .id b{font-weight:500;letter-spacing:.02em;font-size:13px}
  .id i{font-style:normal;color:var(--dim);font-size:11px}
  .id .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);
           box-shadow:0 0 8px var(--accent);transition:background .4s,box-shadow .4s}

  /* --- the instrument --- */
  #avatar{display:none;width:100%;aspect-ratio:1;border-radius:2px}
  body[data-avatar=on] #avatar{display:block}
  body[data-avatar=on] #orb{display:none}
  #orb{width:72px;height:72px;border-radius:50%;margin:2rem auto;
       background:radial-gradient(circle at 35% 30%,#1c2b3a,#0a1017 70%)}

  /* --- transcript: framed blocks, named and colour-coded ---
     Alignment alone stopped being enough once several people can be enrolled:
     the label now carries a real name (Franko / Giulia / Boomer), so it is
     information rather than the redundant "you:" prefix it replaced.

     The frame is a left gutter rule in the speaker's colour plus a faint tint
     of the same hue -- a patch-bay channel strip, not a chat bubble. */
  #log{margin:1.25rem 0 0;min-height:5rem;display:flex;flex-direction:column;
       gap:.55rem;max-height:17rem;overflow-y:auto;scrollbar-width:thin}
  /* Log colours are FIXED, not state-driven. --accent turns amber while she is
     thinking, which collided with the user's amber; and an escalation was amber
     too, so three different things shared one hue. The avatar carries state; the
     log carries identity, and identity must not move.

     Three devices were doing one job here (full border, gutter rule, tint).
     The rule and the tint are enough; the border came off. */
  .msg{--c:#35C8FF;
       margin:0;padding:.42rem .7rem;max-width:88%;line-height:1.55;
       border-left:2px solid var(--c);
       background:color-mix(in oklab, var(--c) 8%, transparent);
       transition:background .3s}
  .msg .who{display:block;font-size:10px;letter-spacing:.14em;
            color:var(--c);margin-bottom:.22rem;opacity:.85}
  .msg .txt{display:block;color:var(--fg)}
  .msg.them{align-self:flex-start}
  /* Each person carries their own hue, set inline from their name. Role is not
     encoded here: it belongs in the voices panel and in the refusal she gives
     when a guest tries to write, not on every line they say. */
  .msg.me{--c:var(--mine);align-self:flex-end}
  .msg.me .txt{opacity:.85}
  /* She started this one. Still her voice, so still her hue -- the escalation is
     marked by a heavier gutter and the hive in the label, not by borrowing the
     user's colour. A blocker is louder than a decision, so it gets its own. */
  .msg.unprompted{border-left-width:4px;
       background:color-mix(in oklab, var(--c) 14%, transparent)}
  .msg.alert{--c:#FF4D6D}
  .msg.pending .txt::after{content:"";display:inline-block;width:.45em;height:1em;
       margin-left:.15em;background:var(--c);vertical-align:-.15em;
       animation:cursor 1s steps(2) infinite}
  @keyframes cursor{50%{opacity:0}}

  /* --- the rail: one hairline, controls sitting on it --- */
  .rail{display:flex;align-items:center;gap:1.1rem;margin-top:1.5rem;
        padding-top:.85rem;border-top:1px solid var(--line)}
  .rail .spacer{flex:1}
  button{
    font:inherit;font-size:12px;color:var(--dim);background:none;border:0;
    padding:.2rem 0;cursor:pointer;letter-spacing:.01em;
    border-bottom:1px solid transparent;transition:color .15s,border-color .15s;
  }
  button:hover:not(:disabled){color:var(--fg);border-bottom-color:var(--line-lit)}
  button:focus-visible{outline:1px solid var(--accent);outline-offset:3px}
  button:disabled{opacity:.35;cursor:default}
  /* the primary action carries a dot, echoing the core */
  #go{color:var(--fg);display:inline-flex;align-items:center;gap:.45rem}
  #go::before{content:"";width:6px;height:6px;border-radius:50%;
              background:var(--accent);box-shadow:0 0 6px var(--accent)}
  #readout{font-size:11px;color:var(--dim);white-space:nowrap}

  /* --- voices: a roster readout, not a form --- */
  #voicepanel{margin-top:1.1rem;border-top:1px solid var(--line);padding-top:.9rem}
  #roster{list-style:none;padding:0;margin:0 0 .9rem;font-size:12px}
  #roster li{display:grid;grid-template-columns:1fr auto auto auto;gap:.8rem;
             align-items:center;padding:.32rem 0;border-bottom:1px solid var(--line)}
  #roster li:last-child{border-bottom:0}
  #roster .pname{color:var(--c,var(--fg))}
  #roster .owner-mark{color:var(--mine);font-size:11px}
  #roster .guest-mark{color:var(--dim);font-size:11px}
  #roster .q{color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums}
  #roster .none{display:block;color:var(--dim)}
  .enrol{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;font-size:12px}
  .enrol input[type=text]{
    font:inherit;font-size:12px;background:none;color:var(--fg);
    border:0;border-bottom:1px solid var(--line-lit);padding:.25rem 0;width:8rem;
  }
  .enrol input[type=text]::placeholder{color:var(--dim)}
  .enrol input[type=text]:focus{outline:0;border-bottom-color:var(--accent)}
  .enrol label{color:var(--dim);display:inline-flex;align-items:center;gap:.35rem;cursor:pointer}
  .enrol input[type=checkbox]{accent-color:var(--mine);margin:0}
  #phrases{margin:.9rem 0 0;padding:0;list-style:none;font-size:12px;
           counter-reset:p}
  #phrases li{color:var(--dim);padding:.22rem 0 .22rem 1.5rem;position:relative}
  #phrases li::before{counter-increment:p;content:counter(p);position:absolute;left:0;
                      color:var(--line-lit);font-size:11px}
  #phrases li.now{color:var(--fg)}
  #phrases li.now::before{color:var(--accent)}
  #phrases li.done{opacity:.4}
  #estatus{font-size:11px;color:var(--dim);margin-top:.7rem;min-height:1.2em}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<main>
  <div class="id"><span class="dot"></span><b>Boomer</b><i id="state">offline</i></div>

  <canvas id="avatar" width="480" height="480"></canvas>
  <div id="orb"></div>

  <div id="log" aria-live="polite"></div>

  <div class="rail">
    <button id="go">listen</button>
    <button id="stop">interrupt</button>
    <button id="reset">clear</button>
    <span class="spacer"></span>
    <button id="voices">voices</button>
    <span id="readout"></span>
  </div>

  <section id="voicepanel" hidden>
    <ul id="roster"></ul>
    <div class="enrol">
      <input id="ename" type="text" placeholder="name" maxlength="40" autocomplete="off">
      <label><input id="eowner" type="checkbox"> can answer the factory</label>
      <span class="spacer"></span>
      <button id="enrol">enrol</button>
      <button id="ecancel" hidden>cancel</button>
    </div>
    <ol id="phrases" hidden></ol>
    <div id="estatus"></div>
  </section>
</main>
<script type="module" src="./boomer.js"></script>
