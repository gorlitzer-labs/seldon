<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<title>seldon</title>
<style>
:root {
  --bg: #f4f2ec; --card: #fffdf8; --ink: #1b1c18; --mute: #6d6c64; --line: #e2dfd5;
  --need: #c2410c; --need-bg: #fdecdf; --work: #2f7d4f; --idle: #8b8a80; --fail: #b42318; --accent: #1b1c18;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  --sans: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  --r: 14px; --safe-b: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e0f0c; --card: #171814; --ink: #ecebe4; --mute: #8f8e85; --line: #2a2b25;
  --need: #fb923c; --need-bg: #2a1a0e; --work: #5fbf86; --idle: #77766d; --fail: #f87171; --accent: #ecebe4;
} }
:root[data-theme="dark"] {
  --bg: #0e0f0c; --card: #171814; --ink: #ecebe4; --mute: #8f8e85; --line: #2a2b25;
  --need: #fb923c; --need-bg: #2a1a0e; --work: #5fbf86; --idle: #77766d; --fail: #f87171; --accent: #ecebe4;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 var(--sans); -webkit-text-size-adjust: 100%; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px calc(96px + var(--safe-b)); }

/* top */
header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px);
  padding: calc(10px + env(safe-area-inset-top, 0px)) 0 10px; border-bottom: 1px solid var(--line); }
.top { display: flex; align-items: baseline; gap: 10px; }
.mark { font: 700 13px/1 var(--mono); letter-spacing: .28em; }
.head { flex: 1; min-width: 0; color: var(--mute); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.live { width: 8px; height: 8px; border-radius: 50%; background: var(--work); align-self: center; transition: opacity .3s; }
.live.stale { background: var(--fail); }
.chips { display: flex; gap: 8px; overflow-x: auto; margin-top: 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card);
  display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.chip .n { font: 600 12px var(--mono); }
.chip.need .n { color: var(--need); }
.chip[aria-pressed="true"].need .n { color: inherit; }
.chip .dot { width: 7px; height: 7px; }

.holds { margin: 12px 0 0; font: 12px var(--mono); color: var(--mute); }
.holds b { color: var(--ink); font-weight: 600; }

/* projects + lanes */
section.proj { margin-top: 18px; }
.ph { display: flex; align-items: center; gap: 8px; min-height: 44px; }
.ph h2 { margin: 0; font-size: 15px; font-weight: 650; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ph .at { font: 12px var(--mono); color: var(--mute); flex: none; }
.ph .sp { flex: 1; }
.ghost { min-height: 44px; min-width: 44px; padding: 0 12px; border: 0; background: none; color: var(--mute); font-size: 13px; border-radius: 10px; }
.ghost:active { background: var(--line); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.lane { display: grid; grid-template-columns: 22px 1fr auto; gap: 2px 10px; align-items: center; width: 100%; text-align: left;
  padding: 12px 14px; min-height: 60px; border: 0; background: none; border-top: 1px solid var(--line); }
.lane:first-child { border-top: 0; }
.lane:active { background: var(--line); }
.lane.needs-you { background: var(--need-bg); }
.lane .g { grid-row: span 2; display: grid; place-items: center; }
.lane .nm { min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lane .ag { font: 12px var(--mono); color: var(--mute); }
.lane .dt { grid-column: 2 / 4; min-width: 0; font-size: 13px; color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lane.needs-you .dt { color: var(--need); font-weight: 600; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--idle); display: inline-block; flex: none; }
.dot.needs-you { background: var(--need); box-shadow: 0 0 0 4px color-mix(in srgb, var(--need) 25%, transparent); animation: pulse 1.6s infinite; }
.dot.working, .dot.running { background: var(--work); }
.dot.failed { background: var(--fail); }
.dot.stopped { background: transparent; border: 2px solid var(--idle); }
@keyframes pulse { 50% { box-shadow: 0 0 0 7px transparent; } }
@media (prefers-reduced-motion: reduce) { .dot.needs-you { animation: none; } }
.empty { padding: 40px 8px; text-align: center; color: var(--mute); }
.empty p { margin: 6px 0; }

/* fab */
.fab { position: fixed; right: max(16px, calc(50% - 304px)); bottom: calc(18px + var(--safe-b)); z-index: 6; min-height: 52px; padding: 0 20px;
  border-radius: 999px; border: 0; background: var(--accent); color: var(--bg); font-weight: 650; box-shadow: 0 6px 24px rgb(0 0 0 / .25); }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .45); z-index: 10; opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-width: 640px; margin: 0 auto; max-height: 92dvh; overflow-y: auto;
  background: var(--card); border-radius: 18px 18px 0 0; padding: 8px 16px calc(20px + var(--safe-b)); transform: translateY(105%); transition: transform .22s ease-out; }
.sheet.on { transform: none; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 12px; }
.sheet h3 { margin: 0; font-size: 18px; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 12px; margin: 6px 0 14px; font: 12px var(--mono); color: var(--mute); }
.meta .st { display: inline-flex; gap: 6px; align-items: center; color: var(--ink); }
.screen { background: #0b0c0a; color: #d8d6cc; font: 11.5px/1.45 var(--mono); border-radius: 10px; padding: 10px 12px; max-height: 42dvh;
  overflow: auto; white-space: pre; margin: 0 0 12px; }
.note { font-size: 13px; color: var(--mute); background: var(--bg); border-radius: 10px; padding: 10px 12px; margin: 0 0 12px; }
.note code { font: 12px var(--mono); color: var(--ink); overflow-wrap: anywhere; }
.keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 8px; }
.k { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font: 600 14px var(--mono); }
.k:active { background: var(--line); }
.row { display: flex; gap: 8px; }
.row > * { min-width: 0; }
.in { flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); padding: 10px 12px; }
textarea.in { min-height: 96px; resize: vertical; width: 100%; }
select.in { width: 100%; }
.btn { min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-weight: 600; }
.btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.btn.danger { color: var(--fail); }
.btn.danger.armed { background: var(--fail); color: #fff; border-color: var(--fail); }
.btn:disabled { opacity: .5; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.actions .btn { flex: 1 1 30%; }
label.f { display: block; font-size: 12px; color: var(--mute); margin: 12px 0 6px; font-weight: 600; letter-spacing: .02em; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg button { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font: 13px var(--mono); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.plan { list-style: none; margin: 0; padding: 0; }
.plan li { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.plan li:first-child { border-top: 0; }
.plan .pr { font: 600 11px var(--mono); color: var(--mute); flex: none; width: 22px; }
.plan .tx { flex: 1; min-width: 0; font-size: 14px; }
.plan .on { font: 11px var(--mono); color: var(--work); }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(84px + var(--safe-b)); z-index: 20; max-width: 560px; margin: 0 auto;
  background: var(--ink); color: var(--bg); padding: 12px 14px; border-radius: 12px; font-size: 14px; opacity: 0; transform: translateY(8px);
  transition: .2s; pointer-events: none; }
.toast.on { opacity: 1; transform: none; }
.toast.err { background: var(--fail); color: #fff; }
</style>
</head>
<body>
<header><div class="wrap" style="padding-bottom:0">
  <div class="top"><span class="mark">SELDON</span><span class="head" id="head">…</span><span class="live" id="live" title="live"></span></div>
  <div class="chips" id="chips" role="toolbar" aria-label="filter"></div>
  <div class="holds" id="holds"></div>
</div></header>
<main class="wrap" id="main"></main>
<button class="fab" data-act="new">+ lane</button>
<div class="scrim" id="scrim" data-act="close"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ago = (ms) => { if (!ms) return ""; const s = Math.max(0, (Date.now() - ms) / 1000 | 0);
  return s < 60 ? s + "s" : s < 3600 ? (s / 60 | 0) + "m" : s < 86400 ? (s / 3600 | 0) + "h" : (s / 86400 | 0) + "d"; };
const detail = (l) => l.state === "needs-you" ? "needs you: " + (l.waitingFor || "input") : l.state === "running" ? "running (no state reported)" : l.state;

let S = null, filter = "all", sheet = null, peekTimer = null, lastNeed = -1;
// The token arrives once in the link seldon serve prints (#t=…), is kept on this device, and
// is taken out of the address bar so it never ends up in a screenshot or a shared URL.
const TOKEN = (() => {
  const m = location.hash.match(/[#&]t=([A-Za-z0-9_-]+)/);
  try { if (m) localStorage.setItem("seldon-token", m[1]); } catch {}
  if (m) history.replaceState(null, "", location.pathname);
  try { return m?.[1] || localStorage.getItem("seldon-token") || ""; } catch { return m?.[1] || ""; }
})();
const api = async (path, body) => {
  const headers = { "x-seldon-token": TOKEN, ...(body ? { "content-type": "application/json" } : {}) };
  const r = await fetch(path, body ? { method: "POST", headers, body: JSON.stringify(body) } : { headers });
  const j = await r.json().catch(() => ({ ok: false, error: "bad reply (" + r.status + ")" }));
  if (r.status === 403) locked(j.error);
  return j;
};
function locked(why) {
  $("head").textContent = "locked";
  $("main").innerHTML = `<div class="empty"><p><b>This device isn't let in.</b></p><p>${esc(why)}</p>
    <p>Open the link <code>seldon serve</code> printed in your terminal (it carries the token).</p></div>`;
  throw new Error(why);
}
const toast = (msg, err) => { const t = $("toast"); t.textContent = msg; t.className = "toast on" + (err ? " err" : ""); clearTimeout(toast.t); toast.t = setTimeout(() => t.className = "toast", 2600); };
const allLanes = () => S ? S.groups.flatMap((g) => g.lanes.map((l) => ({ ...l, group: g }))) : [];
const laneBy = (key) => allLanes().find((l) => l.key === key);

// ---- poll -------------------------------------------------------------------------
async function refresh() {
  try {
    S = await api("/api/state");
    $("live").classList.remove("stale");
    render();
    const need = allLanes().filter((l) => l.state === "needs-you").length;
    if (lastNeed >= 0 && need > lastNeed) alertNeed(need);
    lastNeed = need;
    document.title = need ? `(${need}) seldon` : "seldon";
    if (sheet?.type === "lane") renderLaneSheet(false);
  } catch { $("live").classList.add("stale"); }
}
function alertNeed(n) {
  navigator.vibrate?.(120);
  if (document.hidden && "Notification" in window && Notification.permission === "granted")
    new Notification("seldon", { body: n === 1 ? "an agent needs you" : n + " agents need you", tag: "seldon-need" });
}

// ---- render -----------------------------------------------------------------------
function render() {
  $("head").textContent = S.headline;
  const lanes = allLanes(), need = lanes.filter((l) => l.state === "needs-you").length;
  const chips = [["all", "All", lanes.length, ""], ["need", "Needs you", need, "need"], ["here", "this mac", S.groups.filter((g) => !g.machine).reduce((a, g) => a + g.lanes.length, 0), ""],
    ...S.machines.map((m) => ["m:" + m.name, m.name, m.ok ? m.count : "—", m.ok ? "" : "off"])];
  $("chips").innerHTML = chips.map(([id, label, n, cls]) =>
    `<button class="chip ${cls}" data-act="filter" data-id="${esc(id)}" aria-pressed="${filter === id}">${cls === "off" ? '<span class="dot failed"></span>' : ""}${esc(label)} <span class="n">${esc(n)}</span></button>`).join("");
  $("holds").innerHTML = S.holds?.length ? "held: " + S.holds.map((h) => `<b>${esc(h.name)}</b> → ${esc(h.who)}`).join(" · ") : "";

  const groups = S.groups.map((g) => ({ ...g, lanes: g.lanes.filter((l) =>
    filter === "need" ? l.state === "needs-you" : filter === "here" ? !g.machine : filter.startsWith("m:") ? g.machine === filter.slice(2) : true) }))
    .filter((g) => g.lanes.length);
  $("main").innerHTML = groups.length ? groups.map((g) => `
    <section class="proj">
      <div class="ph"><h2>${esc(g.lanes[0].projectName || g.name.replace(/ @.*/, ""))}</h2>${g.machine ? `<span class="at">@${esc(g.machine)}</span>` : ""}<span class="sp"></span>
        <button class="ghost" data-act="plan" data-root="${esc(g.remoteRoot || g.root)}" data-machine="${esc(g.machine || "")}">plan</button>
        <button class="ghost" data-act="new" data-root="${esc(g.remoteRoot || g.root)}" data-machine="${esc(g.machine || "")}" aria-label="new lane here">+</button></div>
      <div class="card">${g.lanes.map((l) => `
        <button class="lane ${esc(l.state)}" data-act="lane" data-key="${esc(l.key)}">
          <span class="g"><span class="dot ${esc(l.state)}"></span></span>
          <span class="nm">${esc(l.name || l.id || "?")}</span><span class="ag">${esc(l.harness)} ${esc(ago(l.startedAt))}</span>
          <span class="dt">${esc(detail(l))}</span>
        </button>`).join("")}</div>
    </section>`).join("")
    : `<div class="empty"><p><b>${filter === "need" ? "Nobody needs you." : "No agents here."}</b></p><p>${filter === "need" ? "You'll get a buzz when one does." : "Start one with + lane."}</p></div>`;
}

// ---- sheets -----------------------------------------------------------------------
function open(type, data) { sheet = { type, ...data }; $("scrim").classList.add("on"); $("sheet").classList.add("on"); }
function close() { sheet = null; clearInterval(peekTimer); $("scrim").classList.remove("on"); $("sheet").classList.remove("on"); }

function renderLaneSheet(full = true) {
  const l = laneBy(sheet.key);
  if (!l) { $("sheetBody").innerHTML = `<h3>Lane ended</h3><p class="note">It is no longer listed.</p>`; return; }
  const c = l.caps || {};
  const head = `<h3>${esc(l.name || l.id)}</h3>
    <div class="meta"><span class="st"><span class="dot ${esc(l.state)}"></span>${esc(detail(l))}</span><span>${esc(l.harness)}</span>
      <span>${esc(l.group.lanes[0].projectName || l.group.name)}${l.group.machine ? " @" + esc(l.group.machine) : ""}</span><span>${esc(ago(l.startedAt))}</span></div>`;
  if (!full) { $("sheetBody").querySelector(".lanehead").innerHTML = head; return; }
  $("sheetBody").innerHTML = `<div class="lanehead">${head}</div>
    ${c.peek ? `<pre class="screen" id="screen">reading the screen…</pre>` : ""}
    ${c.hint ? `<p class="note">No terminal pane to read for this lane. Open it with <code>${esc(c.hint)}</code>, or from the Claude app via Remote Control.</p>` : ""}
    ${c.reply && S.allowReply ? `
      <div class="keys">${["1", "2", "3", "y"].map((k) => `<button class="k" data-act="text" data-v="${k}">${k}</button>`).join("")}
        ${[["enter", "⏎"], ["esc", "esc"], ["up", "↑"], ["down", "↓"]].map(([k, v]) => `<button class="k" data-act="key" data-v="${k}">${v}</button>`).join("")}</div>
      <form class="row" data-form="reply"><input class="in" name="t" placeholder="reply to the agent…" autocomplete="off" enterkeyhint="send"><button class="btn primary">Send</button></form>`
    : c.reply ? `<p class="note">Read-only. To answer from here, start it with <code>seldon serve --allow-reply</code>.</p>` : ""}
    <div class="actions">
      ${c.stop ? `<button class="btn danger" data-act="stop">Stop</button>` : ""}
      ${c.resume ? `<button class="btn primary" data-act="resume">Resume</button>` : ""}
      ${c.rm ? `<button class="btn danger" data-act="rm">Remove</button>` : ""}
      <button class="btn" data-act="close">Close</button>
    </div>`;
  clearInterval(peekTimer);
  if (c.peek) { peek(); peekTimer = setInterval(peek, 2000); }
}
async function peek() {
  const el = $("screen"); if (!el || !sheet) return;
  const r = await api("/api/peek?key=" + encodeURIComponent(sheet.key));
  const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 8;
  el.textContent = r.ok ? (r.screen || "(empty)") : r.error;
  if (atBottom) el.scrollTop = el.scrollHeight;
}

function projects() {
  return S.groups.map((g) => ({ root: g.remoteRoot || g.root, machine: g.machine || "", label: (g.lanes[0]?.projectName || g.name.replace(/ @.*/, "")) + (g.machine ? " @" + g.machine : "") }));
}
function renderNew(d) {
  const ps = projects(); const pick = ps.find((p) => p.root === d.root && p.machine === (d.machine || "")) || ps[0];
  sheet.agent = sheet.agent || "claude";
  $("sheetBody").innerHTML = `<h3>New lane</h3>
    <form data-form="start">
      <label class="f">Project</label>
      <select class="in" name="p">${ps.map((p, i) => `<option value="${i}" ${p === pick ? "selected" : ""}>${esc(p.label)}</option>`).join("")}</select>
      <label class="f">Task</label>
      <textarea class="in" name="task" placeholder="fix the save crash">${esc(d.task || "")}</textarea>
      <label class="f">Agent</label>
      <div class="seg">${["claude", "codex", "opencode"].map((a) => `<button type="button" data-act="agent" data-v="${a}" aria-pressed="${sheet.agent === a}">${a}</button>`).join("")}</div>
      <div class="actions"><button class="btn primary">Start lane</button><button type="button" class="btn" data-act="close">Cancel</button></div>
    </form>`;
  sheet.projects = ps;
}
async function renderPlan() {
  $("sheetBody").innerHTML = `<h3>Plan</h3><p class="note">reading docs/QUEUE.md…</p>`;
  const r = await api(`/api/plan?root=${encodeURIComponent(sheet.root)}&machine=${encodeURIComponent(sheet.machine || "")}`);
  if (sheet?.type !== "plan") return;
  const items = r.items;
  $("sheetBody").innerHTML = `<h3>Plan</h3><div class="meta"><span>${esc(sheet.root)}${sheet.machine ? " @" + esc(sheet.machine) : ""}</span></div>
    ${!r.ok ? `<p class="note">${esc(r.error)}</p>` : items == null ? `<p class="note">No plan here (foundation not installed, or no docs/QUEUE.md).</p>`
      : !items.length ? `<p class="note">The plan is empty.</p>`
      : `<ul class="plan">${items.map((it, i) => `<li><span class="pr">${esc(it.priority || "")}</span><span class="tx">${esc(it.text)}</span>
          ${it.lane ? `<span class="on">● ${esc(it.lane)}</span>` : `<button class="btn" data-act="item" data-i="${i}">Start</button>`}</li>`).join("")}</ul>`}
    ${!sheet.machine && items ? `<form class="row" data-form="add" style="margin-top:12px"><input class="in" name="t" placeholder="add to the plan…" autocomplete="off"><button class="btn">Add</button></form>` : ""}
    <div class="actions"><button class="btn" data-act="close">Close</button></div>`;
  sheet.items = items;
}

// ---- one listener for everything ----------------------------------------------------
async function doLane(verb, btn) {
  if (verb !== "resume" && !btn.classList.contains("armed")) { btn.classList.add("armed"); btn.textContent = "Tap again to " + verb.replace("rm", "remove"); setTimeout(() => { btn.classList.remove("armed"); btn.textContent = verb === "rm" ? "Remove" : "Stop"; }, 3000); return; }
  btn.disabled = true;
  const r = await api("/api/lane/" + verb, { key: sheet.key });
  toast(r.ok ? ({ stop: "Stopped", resume: "Resumed", rm: "Removed" }[verb]) : r.error, !r.ok);
  if (r.ok && verb !== "resume") close();
  refresh();
}
document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "filter") { filter = b.dataset.id; render(); }
  else if (a === "lane") { open("lane", { key: b.dataset.key }); renderLaneSheet(); maybeAskNotify(); }
  else if (a === "new") { open("new", {}); renderNew({ root: b.dataset.root, machine: b.dataset.machine }); }
  else if (a === "plan") { open("plan", { root: b.dataset.root, machine: b.dataset.machine }); renderPlan(); }
  else if (a === "close") close();
  else if (a === "agent") { sheet.agent = b.dataset.v; b.parentElement.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b)); }
  else if (["stop", "resume", "rm"].includes(a)) doLane(a, b);
  else if (a === "key") reply({ key: b.dataset.v });
  else if (a === "text") reply({ text: b.dataset.v, submit: false });
  else if (a === "item") { const it = sheet.items[b.dataset.i]; const { root, machine } = sheet; open("new", {}); renderNew({ root, machine, task: it.text }); }
});
async function reply(what) {
  const r = await api("/api/lane/reply", { lane: sheet.key, ...what });
  if (!r.ok) toast(r.error, true); else { navigator.vibrate?.(15); setTimeout(peek, 250); }
}
document.addEventListener("submit", async (e) => {
  const f = e.target.closest("[data-form]"); if (!f) return;
  e.preventDefault();
  const kind = f.dataset.form, btn = f.querySelector("button:not([type=button])");
  if (kind === "reply") { const t = f.t.value; if (!t) return; f.t.value = ""; return reply({ text: t }); }
  if (kind === "add") {
    const t = f.t.value.trim(); if (!t) return;
    const r = await api("/api/plan/add", { root: sheet.root, text: t });
    toast(r.ok ? "Added to the plan" : r.error, !r.ok); if (r.ok) renderPlan(); return;
  }
  if (kind === "start") {
    const p = sheet.projects[f.p.value], task = f.task.value.trim();
    if (!p || !task) return toast("pick a project and write a task", true);
    btn.disabled = true; btn.textContent = "Starting…";
    const r = await api("/api/lane/start", { root: p.root, machine: p.machine || null, task, agent: sheet.agent });
    toast(r.ok ? "Started " + (r.slug || "lane") : r.error, !r.ok);
    if (r.ok) close(); else { btn.disabled = false; btn.textContent = "Start lane"; }
    refresh();
  }
});
// Notifications need a secure context (tailscale serve gives one) and a tap to ask.
function maybeAskNotify() {
  if ("Notification" in window && Notification.permission === "default" && window.isSecureContext) Notification.requestPermission();
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && sheet) close(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
refresh();
setInterval(refresh, 3000);
</script>
</body>
