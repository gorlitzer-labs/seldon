name: deploy-seldon-stack
on:
  push:
    branches: [main]
    paths:
      - "apps/seldon-stack/**"
      - ".github/workflows/deploy-seldon-stack.yml"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./apps/seldon-stack
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/gorlitzer-labs/seldon-stack:latest
            ghcr.io/gorlitzer-labs/seldon-stack:${{ github.sha }}
  # Rolls the live deployment to THIS commit's image. Runs on a self-hosted
  # runner that can reach home-k3s (GitHub-hosted runners can't). Keeps the
  # SHA-pin model — no :latest, fully reproducible. One-time setup: register a
  # self-hosted runner with the label `home-k3s` on a tailnet machine that has
  # kubectl access to the cluster. Until then, use scripts/deploy-seldon-stack.sh.
  deploy:
    needs: image
    # Skipped (green) until you register a self-hosted runner labeled `home-k3s`
    # and set repo variable SELF_HOSTED_DEPLOY=true. Until then, roll manually:
    #   scripts/deploy-seldon-stack.sh
    if: ${{ vars.SELF_HOSTED_DEPLOY == 'true' }}
    runs-on: [self-hosted, home-k3s]
    steps:
      - name: Roll seldon-stack to this commit
        run: |
          kubectl -n seldon set image deployment/seldon-stack \
            seldon-stack=ghcr.io/gorlitzer-labs/seldon-stack:${{ github.sha }}
          kubectl -n seldon rollout status deployment/seldon-stack --timeout=120s
