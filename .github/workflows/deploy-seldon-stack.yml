name: deploy-seldon-stack
on:
  push:
    branches: [main]
    paths:
      - "apps/seldon-stack/**"
      - ".github/workflows/deploy-seldon-stack.yml"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./apps/seldon-stack
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/gorlitzer-labs/seldon-stack:latest
            ghcr.io/gorlitzer-labs/seldon-stack:${{ github.sha }}
