name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for version bump
        id: version
        run: |
          # Get version from current commit
          current=$(grep -m1 '^BIFROST_VERSION=' bifrost | cut -d'"' -f2)
          # Get version from previous commit
          previous=$(git show HEAD~1:bifrost 2>/dev/null | grep -m1 '^BIFROST_VERSION=' | cut -d'"' -f2 || echo "")

          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

          if [[ "$current" != "$previous" && -n "$current" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"

            # Parse semver
            IFS='.' read -r cur_major cur_minor cur_patch <<< "$current"
            IFS='.' read -r prev_major prev_minor prev_patch <<< "$previous"

            # Determine bump type
            if [[ "$cur_major" != "$prev_major" ]]; then
              echo "bump=major" >> "$GITHUB_OUTPUT"
            elif [[ "$cur_minor" != "$prev_minor" ]]; then
              echo "bump=minor" >> "$GITHUB_OUTPUT"
            else
              echo "bump=patch" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes
        if: steps.version.outputs.changed == 'true'
        id: notes
        run: |
          prev="v${{ steps.version.outputs.previous }}"
          curr="v${{ steps.version.outputs.current }}"
          bump="${{ steps.version.outputs.bump }}"

          # Get commits since last version tag (or all if first release)
          if git rev-parse "$prev" &>/dev/null; then
            commits=$(git log "$prev"..HEAD --pretty=format:"- %s" --no-merges | grep -v "Co-Authored-By" | grep -v "^- Release")
          else
            commits=$(git log --pretty=format:"- %s" --no-merges | grep -v "Co-Authored-By" | grep -v "^- Release")
          fi

          # Build release body
          case "$bump" in
            major) emoji="🚀" label="Major release" ;;
            minor) emoji="✨" label="Feature release" ;;
            patch) emoji="🔧" label="Patch" ;;
          esac

          body="$emoji **$label** — $curr

          ### Changes

          $commits"

          # Write to file to preserve newlines
          echo "$body" > /tmp/release-notes.md

      - name: Create release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v${{ steps.version.outputs.current }}"
          gh release create "$version" \
            --title "$version" \
            --notes-file /tmp/release-notes.md
